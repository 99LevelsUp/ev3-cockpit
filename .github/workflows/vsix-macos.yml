# The macOS VSIX, built where its Bluetooth helper can be: only Apple's toolchain compiles the Swift
# helper (native/macos/ev3-bt-helper.swift), so without a Mac of our own the darwin-arm64 VSIX is
# built here (the Mac visit, 19.11.2026). Run it by hand, or let a version tag run it.
name: macOS VSIX

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  vsix-darwin-arm64:
    name: Helper + unit tests + darwin-arm64 VSIX
    # Apple Silicon, as the VSIX's target.
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Compile
        run: npm run compile

      - name: Unit tests on macOS
        run: npm run test:unit

      - name: Build the Bluetooth helper
        run: npm run build:helper:macos

      - name: The helper runs and answers
        # With no command it prints its usage and exits 2; anything else means it did not build right.
        run: |
          set +e
          native/bin/ev3-bt-helper
          code=$?
          set -e
          test "$code" -eq 2
          file native/bin/ev3-bt-helper | grep -q arm64

      - name: Package the darwin-arm64 VSIX
        run: node scripts/package-vsix.cjs darwin-arm64

      - name: Upload the VSIX
        uses: actions/upload-artifact@v4
        with:
          name: ev3-cockpit-darwin-arm64
          path: dist-vsix/ev3-cockpit-darwin-arm64-*.vsix
          if-no-files-found: error
