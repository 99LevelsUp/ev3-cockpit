# The TypeScript gate: the extension, the ev3 command, the MCP server and the client library.
# The unit and VS Code host tests start the development build of the native daemon in replay of
# recorded bricks, so the job builds it first. The daemon's own gate, its release builds and the
# packages are in native-daemon.yml.
name: CI

on:
  push:
    branches:
      - master
  pull_request:

permissions:
  contents: read

jobs:
  typescript:
    name: Compile + Lint + Contract + Unit + Host
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Setup Rust
        # The release rust-toolchain.toml names, with its components; rustup is on every runner.
        run: rustup toolchain install
      - name: Cache the daemon's build

        uses: Swatinem/rust-cache@v2
        with:
          workspaces: daemon

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=high --omit=dev

      - name: Build the development daemon the tests start
        # A development build: only the release job of native-daemon.yml marks a build as release.
        run: npm run daemon:build

      - name: Compile, lint, contract freshness, unit and host tests
        run: npm run test:ci
