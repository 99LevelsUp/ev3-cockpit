name: CI

on:
  push:
    branches:
      - master
  pull_request:

jobs:
  test_ci:
    name: Compile + Lint + Unit + Host + Release Gates
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=high --omit=dev

      - name: Run CI release gate suite
        # Its `npm run package` builds all four bundles: extension, daemon, ev3 command, MCP server.
        run: npm run test:ci:release

      - name: The bundled daemon answers the ev3 command on simulated bricks
        run: node scripts/daemon-smoke.cjs

      - name: Stage the npm packages (nothing is published)
        # The macOS Bluetooth helper only builds on a Mac; this Windows job stages without it.
        run: node scripts/package-npm.cjs --skip-build --allow-missing-helpers

      - name: Upload release-gate artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-release-gates
          path: artifacts/vsix
