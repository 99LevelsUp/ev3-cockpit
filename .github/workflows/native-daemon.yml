# The native daemon `ev3-cockpitd` on each platform a release ships for, built where it runs:
# Windows x64 on windows-latest, Linux x64 and arm64 on Ubuntu 22.04 (glibc 2.35, so the binaries
# run on Debian 12 and Raspberry Pi OS).
#
# - rust: the daemon's gate on each platform: format, clippy with warnings as errors, all tests.
# - package: the release build (EV3_COCKPIT_RELEASE_BUILD=1, the only builds marked as release),
#   its manifest, the platform VSIX and npm platform package (each checked: exactly one daemon,
#   the SHA-256 its manifest records, a release build at the package version, executable on
#   Linux), the smoke against the VSIX's daemon in replay of a recorded brick, the binary's SHA-256
#   in the job summary and, outside pull requests, a build provenance attestation of the binary and
#   the packages. Linux packages are packed on Linux, where the executable bit survives; the
#   packages are uploaded as artifacts and nothing is published.
# - released-contract: on a version tag, the contract snapshot is the tagged contract.
#
# Releasing: before tagging vX.Y.Z, run `npm run contract:snapshot` and commit contract/released/
# with the release. The tag's run fails when the snapshot is missing or differs from the contract;
# from then on `npm run contract:check` compares every contract change with that snapshot and
# refuses a breaking change without a raised contract version.
name: Native daemon

on:
  push:
    branches:
      - master
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust:
    name: Rust gate (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: win32-x64
            runner: windows-latest
          - target: linux-x64
            runner: ubuntu-22.04
          - target: linux-arm64
            runner: ubuntu-22.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    defaults:
      run:
        # cargo reads daemon/.cargo/config.toml (the static C runtime on Windows) only from here.
        working-directory: daemon
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        # The release rust-toolchain.toml names, with its components; rustup is on every runner.
        run: rustup toolchain install

      - name: Cache the build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: daemon

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

      - name: Tests
        # GitHub's Windows runner runs every step elevated; the daemon refuses to run so, and the
        # tests that start it say they are skipped. Every failure shows, not only the first crate's.
        run: cargo test --locked --workspace --no-fail-fast

      - name: Tests as a standard user (Windows)
        # The step above skips every test that starts the daemon, because the runner is elevated.
        # Here the test binaries it built run again under a throwaway standard user, which is not
        # elevated, so the pipe, its access list and the daemon's start are tested on Windows too.
        # No test may report itself skipped for elevation.
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $built = cargo test --locked --workspace --no-run --message-format=json 2>$null |
            ConvertFrom-Json | Where-Object { $_.reason -eq 'compiler-artifact' -and $_.profile.test -and $_.executable }
          $chars = [char[]]'abcdefghijkmnpqrstuvwxyzABCDEFGHJKLMNPQRSTUVWXYZ23456789'
          $password = -join (1..24 | ForEach-Object { $chars | Get-Random }) + '!a1'
          $secure = ConvertTo-SecureString $password -AsPlainText -Force
          New-LocalUser -Name ev3ci -Password $secure -AccountNeverExpires -PasswordNeverExpires | Out-Null
          $credential = [pscredential]::new("$env:COMPUTERNAME\ev3ci", $secure)
          $out = Join-Path $env:RUNNER_TEMP 'standard-user'
          New-Item -ItemType Directory $out | Out-Null
          icacls $out /grant 'ev3ci:(OI)(CI)M' | Out-Null
          icacls $env:GITHUB_WORKSPACE /grant 'ev3ci:(OI)(CI)RX' /T /Q | Out-Null
          # A child started with -Credential inherits this process's environment: point its
          # profile folders at the user's own profile, which the first logon creates.
          $profile = 'C:\Users\ev3ci'
          $environment = @{
            USERPROFILE = $profile; HOME = $profile
            APPDATA = "$profile\AppData\Roaming"; LOCALAPPDATA = "$profile\AppData\Local"
            TEMP = "$profile\AppData\Local\Temp"; TMP = "$profile\AppData\Local\Temp"
          }
          Start-Process -FilePath cmd.exe -ArgumentList '/c', 'mkdir "%TEMP%" 2>nul & exit 0' `
            -Credential $credential -LoadUserProfile -Environment $environment -Wait -WindowStyle Hidden
          if (-not (Test-Path $environment.TEMP)) { throw "the standard user's profile was not created" }
          $failed = @()
          foreach ($test in $built) {
            $name = "$($test.target.name)-$(($test.target.kind) -join ',')"
            $log = Join-Path $out "$name.out.txt"
            $err = Join-Path $out "$name.err.txt"
            $process = Start-Process -FilePath $test.executable -Credential $credential -LoadUserProfile -Environment $environment `
              -WorkingDirectory (Split-Path $test.manifest_path) -Wait -PassThru `
              -RedirectStandardOutput $log -RedirectStandardError $err
            $text = (Get-Content $log, $err -Raw -ErrorAction SilentlyContinue) -join "`n"
            $summary = ($text -split "`n" | Select-String '^test result' | Select-Object -Last 1)
            "{0,-32} exit {1}  {2}" -f $name, $process.ExitCode, $summary
            if ($process.ExitCode -ne 0) { $failed += $name; $text }
            elseif ($text -match 'runs elevated') { $failed += "$name (skipped for elevation)"; $text }
          }
          if ($failed) { throw "Failed as a standard user: $($failed -join ', ')" }

  package:
    name: Release build, packages and smoke (${{ matrix.target }})
    needs: rust
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: win32-x64
            runner: windows-latest
          - target: linux-x64
            runner: ubuntu-22.04
          - target: linux-arm64
            runner: ubuntu-22.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
      attestations: write
    env:
      # Read by the daemon's build.rs (the build kind) and by daemon-manifest.mts; every other build
      # in CI is a development build.
      EV3_COCKPIT_RELEASE_BUILD: '1'
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Setup Rust
        # The release rust-toolchain.toml names, with its components; rustup is on every runner.
        run: rustup toolchain install
      - name: Cache the build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: daemon
          key: release

      - name: Install dependencies
        run: npm ci

      - name: Build the daemon and ev3, a release build
        working-directory: daemon
        run: cargo build --release --locked -p ev3-cockpitd -p ev3-cli

      - name: Write its manifest
        run: node scripts/daemon-manifest.mts --profile release

      - name: Compile the client library the smoke uses
        run: npm run compile

      - name: Package the VSIX
        run: node scripts/package-vsix.mts ${{ matrix.target }} --daemon-dir daemon/target/release

      - name: The VSIX's daemon serves a recorded brick
        # Not on Windows: GitHub's Windows runner is elevated, and the daemon never runs elevated.
        if: matrix.target != 'win32-x64'
        run: node scripts/daemon-smoke.mts --daemon-dir .vsix-staging/${{ matrix.target }}

      - name: Stage and pack the npm platform package
        run: |
          node scripts/package-npm.mts --platform ${{ matrix.target }} --daemon-dir daemon/target/release
          npm pack ./dist/npm/${{ matrix.target }} --pack-destination dist/npm

      - name: The packaged ev3 runs and is this version
        # --version starts no daemon, so it runs on the elevated Windows runner too.
        run: |
          ev3="./dist/npm/${{ matrix.target }}/$(node -p "require('./scripts/packaging.mts').cliBinary('${{ matrix.target }}')")"
          printed=$("$ev3" --version)
          expected=$(node -p "require('./package.json').version")
          echo "$ev3 --version: $printed"
          test "$printed" = "$expected"

      - name: Stage and pack the client and cockpit npm packages
        # The same on every platform: packed once, on Linux.
        if: matrix.target == 'linux-x64'
        run: |
          npm run bundle
          node scripts/package-npm.mts --skip-build
          npm pack ./dist/npm/client ./dist/npm/cockpit --pack-destination dist/npm

      - name: SHA-256 of the daemon and ev3
        id: daemon
        run: |
          binary=daemon/target/release/$(node -p "require('./scripts/packaging.mts').daemonBinary('${{ matrix.target }}')")
          cli=daemon/target/release/$(node -p "require('./scripts/packaging.mts').cliBinary('${{ matrix.target }}')")
          sum=$(sha256sum "$binary" | cut -d' ' -f1)
          cli_sum=$(sha256sum "$cli" | cut -d' ' -f1)
          echo "$sum  ev3-cockpitd-${{ matrix.target }}" > "ev3-cockpitd-${{ matrix.target }}.sha256"
          echo "$cli_sum  ev3-${{ matrix.target }}" >> "ev3-cockpitd-${{ matrix.target }}.sha256"
          echo "binary=$binary" >> "$GITHUB_OUTPUT"
          echo "cli=$cli" >> "$GITHUB_OUTPUT"
          echo "- \`ev3-cockpitd\` ${{ matrix.target }}: \`$sum\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- \`ev3\` ${{ matrix.target }}: \`$cli_sum\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Attest the build provenance
        if: github.event_name != 'pull_request'
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            ${{ steps.daemon.outputs.binary }}
            ${{ steps.daemon.outputs.cli }}
            dist-vsix/*.vsix
            dist/npm/*.tgz

      - name: Upload the packages
        uses: actions/upload-artifact@v4
        with:
          name: ev3-cockpit-${{ matrix.target }}
          path: |
            dist-vsix/*.vsix
            dist/npm/*.tgz
            ev3-cockpitd-${{ matrix.target }}.sha256
          if-no-files-found: error

  released-contract:
    name: The contract snapshot is the tagged contract
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Record the contract as released and compare with the committed snapshot
        run: |
          npm run contract:snapshot
          changed=$(git status --porcelain -- contract/released)
          if [ -n "$changed" ]; then
            echo "contract/released/ does not hold this release's contract. Run npm run contract:snapshot, commit contract/released/ and tag again:"
            echo "$changed"
            exit 1
          fi
