[package]
name = "ev3-runtime"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
async-trait = "0.1.92"
ev3-contract = { path = "../contract" }
ev3-protocol = { path = "../protocol" }
ev3-transports = { path = "../transports" }
futures-util = { version = "0.3.34", default-features = false, features = ["std"] }
md-5 = "0.10.6"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["time", "sync", "rt", "macros"] }

[dev-dependencies]
tokio = { version = "1.54.1", features = ["macros", "rt", "rt-multi-thread", "sync", "test-util", "time"] }

[lints]
workspace = true
